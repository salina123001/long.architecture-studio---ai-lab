<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>靈籤祈願所</title>
  <style>
    /* ═══ RESET & ROOT ═══ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #040610; }

    :root {
      --bg:      #040610;
      --gold:    #e8b44a;
      --goldhi:  #fcd97a;
      --silver:  #cbd5e1;
      --dim:     rgba(255,255,255,0.48);
      --ring-c:  #60a5fa;
      font-size: 16px;
    }

    body {
      background-color: #040610;
      color: #f0f4ff;
      font-family: 'KaiTi','STKaiti','SimSun','STSong',serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ═══ BACKGROUND REALM ═══ */
    #realm {
      position: fixed; inset: 0; z-index: 0;
      transition: background 1.2s ease, opacity 1.2s ease;
      background: radial-gradient(ellipse 120% 80% at 50% -10%, var(--realm-c) 0%, transparent 70%);
    }
    #realm-rays {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.35;
      animation: rays-spin 60s linear infinite;
      /* background set via JS to avoid conic-gradient + CSS-var parse issues */
    }
    @keyframes rays-spin { to { transform: rotate(360deg); } }

    #star-canvas {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
    }

    /* ═══ NAV ═══ */
    #topnav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.9rem 1.6rem;
      background: linear-gradient(180deg, rgba(4,6,16,0.9) 0%, transparent 100%);
    }
    #topnav a {
      color: rgba(232,180,74,0.7); font-size: 0.82rem;
      text-decoration: none; letter-spacing: 0.12em;
      transition: color 0.2s;
    }
    #topnav a:hover { color: var(--gold); }
    #topnav .site-name {
      font-size: 0.82rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.3);
    }

    /* ═══ MAIN WRAPPER ═══ */
    main {
      position: relative; z-index: 10;
      max-width: 960px; margin: 0 auto;
      padding: 5rem 1.4rem 4rem;
      display: flex; flex-direction: column; align-items: center;
    }

    /* ═══ HEADER ═══ */
    #header { text-align: center; margin-bottom: 3.5rem; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 0.7rem;
      font-size: 0.7rem; letter-spacing: 0.45em; color: rgba(232,180,74,0.65);
      margin-bottom: 1.2rem;
    }
    .eyebrow::before, .eyebrow::after {
      content: ''; width: 32px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,180,74,0.5));
    }
    .eyebrow::after { transform: scaleX(-1); }
    #main-title {
      font-size: clamp(3.5rem, 10vw, 6rem);
      font-weight: 900;
      letter-spacing: 0.25em;
      line-height: 1;
      color: #fcd97a;
      text-shadow: 0 0 30px rgba(232,180,74,0.7), 0 0 70px rgba(232,180,74,0.35), 0 0 120px rgba(232,180,74,0.15);
      margin-bottom: 1.2rem;
    }
    #header p {
      color: rgba(240,244,255,0.55); font-size: 0.9rem;
      line-height: 2.1; letter-spacing: 0.05em;
    }

    /* ═══ DEITY PORTALS ═══ */
    #deity-section { width: 100%; margin-bottom: 4rem; }
    #deity-section h2 {
      text-align: center; font-size: 1.05rem; letter-spacing: 0.35em;
      color: rgba(232,180,74,0.55); margin-bottom: 2.5rem;
    }
    #portal-row {
      display: flex; justify-content: center; gap: 3rem;
      flex-wrap: wrap;
    }

    .portal-wrap {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.9rem; cursor: pointer;
    }
    .portal {
      position: relative; width: 148px; height: 148px;
      border-radius: 50%;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1);
    }
    .portal:hover { transform: translateY(-6px) scale(1.04); }
    .portal.active { transform: translateY(-6px) scale(1.06); }

    /* Outer rotating ring */
    .p-ring-outer {
      position: absolute; inset: -12px;
      border-radius: 50%;
      border: 1px dashed rgba(255,255,255,0.18);
      animation: p-spin 18s linear infinite;
    }
    .portal.active .p-ring-outer {
      border-color: var(--ring-c);
      border-style: solid;
      border-width: 1.5px;
      filter: drop-shadow(0 0 6px var(--ring-c));
      animation-duration: 8s;
    }
    @keyframes p-spin { to { transform: rotate(360deg); } }

    /* Inner ring */
    .p-ring-inner {
      position: absolute; inset: -4px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.14);
      transition: border-color 0.4s, box-shadow 0.4s;
    }
    .portal.active .p-ring-inner {
      border-color: var(--ring-c);
      box-shadow: 0 0 24px var(--ring-c), 0 0 60px var(--ring-c), inset 0 0 20px rgba(0,0,0,0.5);
    }

    /* Disc */
    .p-disc {
      width: 100%; height: 100%; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 40% 35%, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.7) 100%);
      border: 1px solid rgba(255,255,255,0.12);
      position: relative; overflow: hidden;
      transition: background 0.6s;
    }
    .portal.active .p-disc {
      background: radial-gradient(circle at 40% 30%, rgba(255,255,255,0.18) 0%, rgba(0,0,0,0.55) 100%);
    }
    .p-disc::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 50% 110%, var(--ring-c) 0%, transparent 60%);
      opacity: 0; transition: opacity 0.5s;
    }
    .portal.active .p-disc::after { opacity: 0.35; }

    .p-icon { font-size: 3.2rem; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3)); }
    .portal.active .p-icon { filter: drop-shadow(0 0 16px var(--ring-c)); }

    /* Name + tag */
    .portal-name {
      font-size: 1.25rem; letter-spacing: 0.2em; color: rgba(240,244,255,0.75);
      transition: color 0.4s;
    }
    .portal.active .portal-name { color: var(--gold); }
    .portal-tag {
      font-size: 0.7rem; letter-spacing: 0.15em; color: rgba(240,244,255,0.35);
      transition: color 0.4s;
    }
    .portal.active .portal-tag { color: rgba(232,180,74,0.7); }

    /* ═══ ALTAR SECTION ═══ */
    #altar-section {
      width: 100%; display: flex; flex-direction: column; align-items: center;
      margin-bottom: 3rem;
    }

    /* Altar table */
    .altar-table {
      position: relative; width: 100%; max-width: 680px;
      padding: 3rem 2rem 2.5rem;
      text-align: center;
      border-top: 1px solid rgba(232,180,74,0.25);
      border-bottom: 1px solid rgba(232,180,74,0.25);
    }
    .altar-table::before, .altar-table::after {
      content: ''; position: absolute; top: -1px; bottom: -1px; width: 1px;
      background: linear-gradient(180deg, transparent, rgba(232,180,74,0.25), transparent);
    }
    .altar-table::before { left: 0; }
    .altar-table::after  { right: 0; }

    /* Candles (pure CSS) */
    .altar-candles {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 2rem; transform: translateY(-100%);
    }
    .candle { position: relative; display: inline-flex; flex-direction: column; align-items: center; }
    .candle-body {
      width: 10px; height: 44px;
      background: linear-gradient(90deg,#f7e28a,#e8b83a,#f7e28a);
      border-radius: 2px;
    }
    .flame {
      position: absolute; bottom: calc(100% - 2px); left: 50%;
      transform: translateX(-50%);
      width: 10px; height: 18px;
      background: radial-gradient(ellipse at 50% 90%, #fff 0%, #ffe033 30%, #ff6600 75%, transparent 100%);
      border-radius: 50% 50% 30% 30%/60% 60% 40% 40%;
      animation: flicker 1.7s ease-in-out infinite alternate;
      filter: blur(0.4px);
    }
    @keyframes flicker {
      0%   { transform: translateX(-50%) scaleX(1)    scaleY(1);    opacity:0.9; }
      40%  { transform: translateX(-53%) scaleX(0.85) scaleY(1.15); opacity:1;   }
      100% { transform: translateX(-47%) scaleX(1.12) scaleY(0.92); opacity:0.85;}
    }
    .flame-halo {
      position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
      width: 28px; height: 36px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,200,60,0.5) 0%, transparent 70%);
      animation: flicker 1.7s ease-in-out infinite alternate;
    }

    /* Lot container */
    .lot-pedestal {
      display: inline-flex; flex-direction: column; align-items: center;
      margin-bottom: 2rem; cursor: pointer;
      transition: filter 0.3s;
    }
    .lot-pedestal:hover { filter: drop-shadow(0 0 20px var(--ring-c)); }

    .lot-tube {
      position: relative; width: 100px; height: 178px;
      transform-origin: center bottom;
    }
    /* Tube body */
    .lot-tube-body {
      position: absolute; inset: 0;
      background: linear-gradient(120deg,
        #3d1205 0%, #7a2a0e 22%, #b84418 45%,
        #c8501a 50%, #b84418 55%,
        #7a2a0e 78%, #3d1205 100%);
      border-radius: 14px 14px 20px 20px;
      border: 2px solid rgba(232,180,74,0.55);
      box-shadow:
        0 0 50px rgba(232,180,74,0.15),
        4px 8px 24px rgba(0,0,0,0.85),
        inset 0 0 30px rgba(0,0,0,0.45);
      overflow: hidden;
    }
    .lot-tube-body::before {
      content: ''; position: absolute;
      top: 0; left: 28%; right: 28%; bottom: 0;
      background: linear-gradient(180deg, rgba(255,220,120,0.2), rgba(255,120,50,0.06) 35%, transparent 70%);
    }
    .lot-tube-body::after {
      content: '聖';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      font-size: 2.6rem; color: rgba(232,180,74,0.28);
      text-shadow: 0 0 12px rgba(232,180,74,0.3);
    }
    .lot-band-top { position: absolute; left: 0; right: 0; top: 26px; height: 10px; background: linear-gradient(180deg,rgba(232,180,74,0.55),rgba(232,180,74,0.18)); border-top: 1px solid rgba(232,180,74,0.6); }
    .lot-band-bot { position: absolute; left: 0; right: 0; bottom: 26px; height: 10px; background: linear-gradient(180deg,rgba(232,180,74,0.18),rgba(232,180,74,0.55)); border-bottom: 1px solid rgba(232,180,74,0.6); }

    /* Sticks */
    .lot-sticks {
      position: absolute; bottom: 100%; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 4px; align-items: flex-end;
    }
    .lot-stick {
      width: 6px; border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, #f5e070, #c89008, #7b5e0a);
      box-shadow: 1px 0 3px rgba(0,0,0,0.45);
      transform-origin: bottom center;
    }
    .lot-stick:nth-child(1){height:48px;transform:rotate(-11deg);}
    .lot-stick:nth-child(2){height:60px;transform:rotate(-4deg);}
    .lot-stick:nth-child(3){height:66px;transform:rotate(0);}
    .lot-stick:nth-child(4){height:56px;transform:rotate(5deg);}
    .lot-stick:nth-child(5){height:46px;transform:rotate(12deg);}

    /* Float / shake */
    @keyframes float-lot {
      0%,100%{transform:rotate(-1.5deg) translateY(0);}
      50%{transform:rotate(1.5deg) translateY(-10px);}
    }
    @keyframes shake-lot {
      0%,100%{transform:rotate(0);}
      7%{transform:rotate(-15deg);}
      18%{transform:rotate(17deg);}
      30%{transform:rotate(-12deg);}
      42%{transform:rotate(14deg);}
      55%{transform:rotate(-8deg);}
      67%{transform:rotate(9deg);}
      78%{transform:rotate(-4deg);}
      89%{transform:rotate(3deg);}
    }
    .lot-tube.floating{animation:float-lot 3.2s ease-in-out infinite;}
    .lot-tube.shaking{animation:shake-lot 1.3s ease-in-out;}

    .altar-label {
      font-size: 0.75rem; letter-spacing: 0.35em; color: var(--dim);
      margin-bottom: 0.5rem;
    }
    .altar-hint {
      font-size: 1.2rem; letter-spacing: 0.18em;
      color: rgba(240,244,255,0.65); margin-bottom: 0.35rem;
    }
    .altar-sub {
      font-size: 0.82rem; color: rgba(240,244,255,0.38);
      letter-spacing: 0.08em; line-height: 1.85; margin-bottom: 1.8rem;
    }

    /* Draw button */
    .btn-draw {
      display: inline-block;
      padding: 0.85rem 3.5rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #5a0505 0%, #9b1010 45%, #5a0505 100%);
      border: 1px solid rgba(232,180,74,0.6);
      color: var(--gold);
      font-family: inherit; font-size: 1.05rem; letter-spacing: 0.28em;
      cursor: pointer;
      box-shadow: 0 0 40px rgba(155,16,16,0.4), 0 6px 24px rgba(0,0,0,0.5);
      transition: all 0.3s;
      position: relative; overflow: hidden;
    }
    .btn-draw::before {
      content: ''; position: absolute;
      top: -60%; left: -120%; width: 50%; height: 220%;
      background: linear-gradient(90deg,transparent,rgba(255,255,255,0.1),transparent);
      transform: skewX(-25deg); transition: left 0.55s;
    }
    .btn-draw:hover::before{left:160%;}
    .btn-draw:hover{transform:scale(1.06);box-shadow:0 0 60px rgba(155,16,16,0.6),0 8px 30px rgba(0,0,0,0.6);}
    .btn-draw:active{transform:scale(0.97);}

    /* ═══ RESULT SECTION ═══ */
    #result-section {
      width: 100%; max-width: 860px;
      display: none; /* shown via JS */
    }
    @keyframes result-rise {
      0%  { opacity:0; transform:translateY(40px); }
      100%{ opacity:1; transform:translateY(0); }
    }
    .result-rise { animation: result-rise 0.8s cubic-bezier(0.22,1,0.36,1) forwards; }

    /* Top: deity + lot no + level */
    .result-header {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem;
      padding-bottom: 1.2rem;
      border-bottom: 1px solid rgba(232,180,74,0.2);
    }
    .result-meta { display: flex; flex-direction: column; gap: 0.3rem; }
    .result-deity { font-size: 0.75rem; letter-spacing: 0.3em; color: rgba(232,180,74,0.6); }
    .result-no { font-size: 1.5rem; letter-spacing: 0.2em; color: var(--gold); }

    /* Fortune level big */
    .result-level {
      font-size: 1rem; letter-spacing: 0.18em; font-weight: bold;
      padding: 0.45rem 1.6rem; border-radius: 9999px;
    }
    .lv-da    { background:linear-gradient(135deg,#b87700,#fcd97a,#b87700); color:#1a0800; }
    .lv-shang { background:linear-gradient(135deg,#7a5200,#c89440,#7a5200); color:#100500; }
    .lv-zhji  { background:linear-gradient(135deg,#504030,#9a7a50,#504030); color:#100500; }
    .lv-ping  { background:linear-gradient(135deg,#333,#777,#333); color:#eee; }
    .lv-xia   { background:linear-gradient(135deg,#5a1800,#8a3010,#5a1800); color:#ffd8b0; }
    .lv-xx    { background:linear-gradient(135deg,#280000,#6b0000,#280000); color:#fcd97a; }

    /* ── Poem block: vertical layout ── */
    .poem-area {
      display: flex; justify-content: center; align-items: flex-start;
      margin-bottom: 2.5rem;
      padding: 2.5rem 2rem;
      background: linear-gradient(145deg, rgba(8,4,22,0.85), rgba(20,8,30,0.65));
      border: 1px solid rgba(232,180,74,0.18);
      border-radius: 1.2rem;
      position: relative;
      overflow: hidden;
    }
    .poem-area::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(232,180,74,0.06) 0%, transparent 65%);
    }
    .poem-seal {
      position: absolute; right: 1.2rem; bottom: 1rem;
      width: 52px; height: 52px; border-radius: 4px;
      border: 2px solid rgba(180,30,30,0.6);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; letter-spacing: 0.05em; line-height: 1.5;
      color: rgba(180,30,30,0.7); text-align: center;
      background: rgba(120,10,10,0.15);
    }
    .poem-vertical {
      display: flex;
      flex-direction: row-reverse; /* right-to-left column order */
      gap: 2.2rem;
      position: relative; z-index: 1;
    }
    .poem-col {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      font-size: clamp(1.3rem, 3vw, 1.75rem);
      line-height: 1;
      letter-spacing: 0.28em;
      color: #f0f4ff;
      text-shadow: 0 0 18px rgba(232,180,74,0.3);
    }
    /* Decorative vertical bars */
    .poem-deco {
      writing-mode: vertical-rl;
      font-size: 0.65rem; letter-spacing: 0.5em;
      color: rgba(232,180,74,0.22); padding: 0 0.4rem;
      display: flex; align-items: center;
    }

    /* ── Detail grid ── */
    .detail-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.85rem; margin-bottom: 1.2rem;
    }
    .detail-card {
      background: rgba(8,4,22,0.7);
      border: 1px solid rgba(232,180,74,0.13);
      border-radius: 0.85rem; padding: 1rem 1.1rem;
    }
    .detail-card h4 {
      font-size: 0.8rem; letter-spacing: 0.15em; color: var(--gold);
      margin-bottom: 0.4rem;
    }
    .detail-card p { font-size: 0.82rem; line-height: 1.95; color: rgba(240,244,255,0.68); }

    .result-explain {
      margin-bottom: 1rem; padding: 1rem 1.3rem;
      background: rgba(232,180,74,0.05); border: 1px solid rgba(232,180,74,0.18);
      border-radius: 0.85rem; font-size: 0.85rem; line-height: 2;
      color: rgba(240,244,255,0.78);
    }
    .result-advice {
      margin-bottom: 1.8rem; padding: 1rem 1.3rem;
      background: rgba(120,10,10,0.1); border: 1px solid rgba(200,40,40,0.2);
      border-radius: 0.85rem; font-size: 0.85rem; line-height: 2;
      color: rgba(240,244,255,0.82);
    }
    .gold-label { color: var(--gold); font-weight: bold; }

    /* ── Action buttons ── */
    .action-row { display: flex; gap: 0.7rem; flex-wrap: wrap; }
    .btn-ghost {
      flex: 1; min-width: 100px;
      padding: 0.65rem 1rem; border-radius: 9999px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(232,180,74,0.25);
      color: rgba(240,244,255,0.72); font-family: inherit; font-size: 0.85rem;
      letter-spacing: 0.12em; cursor: pointer; transition: all 0.25s;
    }
    .btn-ghost:hover { background: rgba(232,180,74,0.1); border-color: rgba(232,180,74,0.5); }

    /* ── Divider ── */
    .or-div {
      display: flex; align-items: center; gap: 0.8rem;
      color: rgba(232,180,74,0.4); font-size: 0.7rem; letter-spacing: 0.3em;
      margin: 0.8rem 0;
    }
    .or-div::before, .or-div::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(90deg,transparent,rgba(232,180,74,0.3),transparent);
    }

    /* ── Footer ── */
    footer {
      position: relative; z-index: 10;
      text-align: center; padding: 2rem 1rem 3rem;
      font-size: 0.72rem; color: rgba(240,244,255,0.25); letter-spacing: 0.1em; line-height: 2;
    }

    /* ── Responsive ── */
    @media(max-width:640px){
      #portal-row { gap: 1.5rem; }
      .portal { width: 110px; height: 110px; }
      .p-icon { font-size: 2.4rem; }
      .portal-name { font-size: 1rem; }
      .detail-grid { grid-template-columns: 1fr; }
      .poem-col { font-size: 1.1rem; }
      .poem-vertical { gap: 1.4rem; }
    }
    @media(max-width:420px){
      .portal { width: 90px; height: 90px; }
      .p-ring-outer { inset: -8px; }
      .p-icon { font-size: 2rem; }
    }
  </style>
</head>
<body>

<!-- ── Dynamic background ── -->
<div id="realm"></div>
<div id="realm-rays"></div>
<canvas id="star-canvas"></canvas>

<!-- ── Nav ── -->
<nav id="topnav">
  <a href="index.html">← 返回修行網</a>
  <span class="site-name">電子木魚修行網</span>
</nav>

<!-- ═══════════ MAIN ═══════════ -->
<main>

  <!-- Header -->
  <div id="header">
    <div class="eyebrow">SACRED ORACLE LOTS</div>
    <h1 id="main-title">靈籤祈願所</h1>
    <p>請靜下心，選擇想請示的神明，心中默念你的問題<br>
    當你準備好了，搖動籤筒，領取今日神明指引</p>
  </div>

  <!-- Deity Portals -->
  <section id="deity-section">
    <h2>— 選擇祈願神明 —</h2>
    <div id="portal-row"></div>
  </section>

  <!-- Altar -->
  <section id="altar-section">
    <div class="altar-table">
      <div class="altar-candles">
        <div class="candle">
          <div class="flame-halo"></div>
          <div class="flame"></div>
          <div class="candle-body"></div>
        </div>
        <div class="candle">
          <div class="flame-halo" style="animation-delay:.6s"></div>
          <div class="flame" style="animation-delay:.6s"></div>
          <div class="candle-body"></div>
        </div>
      </div>

// ────────────────────────────────────────────────
// STATE

let selectedKey = 'mazu';

// ────────────────────────────────────────────────
// BACKGROUND REALM
// ────────────────────────────────────────────────
function applyRealm(key) {
  const cfg = DEITY_CONFIG[key];
  const realm = document.getElementById('realm');
  const rays  = document.getElementById('realm-rays');
  const r = cfg.ray;
  realm.style.background = `radial-gradient(ellipse 130% 70% at 50% -10%, ${cfg.realm} 0%, transparent 70%)`;
  rays.style.background  = `conic-gradient(from 0deg at 50% 0%,`+
    `transparent 0deg,${r} 8deg,transparent 16deg,`+
    `transparent 40deg,${r} 48deg,transparent 56deg,`+
    `transparent 110deg,${r} 118deg,transparent 126deg,`+
    `transparent 180deg,${r} 188deg,transparent 196deg,`+
    `transparent 250deg,${r} 258deg,transparent 266deg)`;
  document.documentElement.style.setProperty('--ring-c', cfg.ring);
}

// ────────────────────────────────────────────────
// STARS
// ────────────────────────────────────────────────
function initStars() {
  const cv = document.getElementById('star-canvas');
  const ctx = cv.getContext('2d');
  let W, H, stars;

  function setup() {
    W = cv.width  = window.innerWidth;
    H = cv.height = window.innerHeight;
    stars = Array.from({length: 90}, () => ({
      x: Math.random() * W,   y: Math.random() * H,
      r: Math.random() * 1.4 + 0.3,
      vy: -(Math.random() * 0.25 + 0.05),
      vx: (Math.random() - 0.5) * 0.1,
      life: Math.random(),
      max: Math.random() * 0.55 + 0.1,
    }));
  }
  setup();
  window.addEventListener('resize', setup);

  (function loop() {
    ctx.clearRect(0, 0, W, H);
    stars.forEach(s => {
      s.x += s.vx; s.y += s.vy; s.life += 0.002;
      if (s.y < -4) { s.y = H + 4; s.x = Math.random() * W; s.life = 0; }
      const a = s.max * Math.sin(Math.PI * Math.min(s.life, 1));
      if (a <= 0) return;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.283);
      ctx.fillStyle = `rgba(218,165,32,${a.toFixed(3)})`;
      ctx.fill();
    });
    requestAnimationFrame(loop);
  })();
}

// ────────────────────────────────────────────────
// WEB AUDIO
// ────────────────────────────────────────────────
function getAC() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playBell() {   /* 廟鐘 */
  try {
    const c = getAC(), t = c.currentTime;
    [[190,0.45,4.5],[380,0.18,3],[570,0.09,2]].forEach(([f,a,d]) => {
      const o=c.createOscillator(), g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.start(t); o.stop(t+d);
    });
  }catch(e){}
}

function playShakeSound() {   /* 籤筒搖動 */
  try {
    const c=getAC(), t=c.currentTime, sr=c.sampleRate;
    const len=Math.floor(sr*1.4), buf=c.createBuffer(1,len,sr), d=buf.getChannelData(0);
    for(let i=0;i<len;i++){
      const p=[0.05,0.17,0.31,0.47,0.62,0.76].reduce((a,pt)=>a+Math.exp(-Math.abs(i/len-pt)*60)*0.75,0);
      d[i]=(Math.random()*2-1)*p*Math.exp(-(i/len)*1.8)*0.65;
    }
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2000; f.Q.value=1.5;
    const g=c.createGain(); g.gain.value=0.65;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  }catch(e){}
}

function playRevealChime() {   /* 揭曉風鈴 */
  try {
    const c=getAC(), t=c.currentTime;
    [523.25,587.33,659.25,783.99,880,1046.5].forEach((f,i)=>{
      const st=t+i*0.16;
      [[f,0.28,1.8],[f*2,0.08,1.0]].forEach(([freq,amp,dur])=>{
        const o=c.createOscillator(),g=c.createGain();
        o.connect(g); g.connect(c.destination);
        o.type='sine'; o.frequency.value=freq;
        g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(amp,st+0.04);
        g.gain.exponentialRampToValueAtTime(0.0001,st+dur);
        o.start(st); o.stop(st+dur);
      });
    });
  }catch(e){}
}

function playGong() {   /* 大鑼 */
  try {
    const c=getAC(), t=c.currentTime;
    [[80,0.5,2.5],[160,0.2,1.5],[240,0.1,1.0]].forEach(([f,a,d])=>{
      const o=c.createOscillator(),g=c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type='sine'; o.frequency.setValueAtTime(f,t);
      o.frequency.exponentialRampToValueAtTime(f*0.85,t+d);
      g.gain.setValueAtTime(a,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.start(t); o.stop(t+d);
    });
  }catch(e){}
}

function playClick() {
  try {
    const c=getAC(),t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.value=880;
    g.gain.setValueAtTime(0.1,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.1);
    o.start(t);o.stop(t+0.1);
  }catch(e){}
}

// ────────────────────────────────────────────────
// PORTAL RENDER
// ────────────────────────────────────────────────
function renderPortals() {
  const row = document.getElementById('portal-row');
  row.innerHTML = '';
  Object.entries(DEITY_CONFIG).forEach(([key, cfg]) => {
    const wrap = document.createElement('div');
    wrap.className = 'portal-wrap';
    wrap.innerHTML = `
      <div class="portal${selectedKey===key?' active':''}" id="portal-${key}"
           style="--ring-c:${cfg.ring}" onclick="selectDeity('${key}')">
        <div class="p-ring-outer"></div>
        <div class="p-ring-inner"></div>
        <div class="p-disc">
          <span class="p-icon">${cfg.icon}</span>
        </div>
      </div>
      <span class="portal-name">${cfg.name}</span>
      <span class="portal-tag">${cfg.tag}</span>
    `;
    row.appendChild(wrap);
  });
}

// ────────────────────────────────────────────────
// SELECT DEITY
// ────────────────────────────────────────────────
function selectDeity(key) {
  if (selectedKey === key) return;
  playBell();
  selectedKey = key;
  applyRealm(key);
  renderPortals();
  resetDraw(true);
  document.getElementById('altar-label').textContent = `向${DEITY_CONFIG[key].name}祈願`;
}

// ────────────────────────────────────────────────
// SHAKE + DRAW
// ────────────────────────────────────────────────
function onTubeClick() {
  if (isShaking) return;
  playShakeSound();
  doShake();
}

function doShake() {
  if (isShaking) return;
  isShaking = true;
  const tube = document.getElementById('lot-tube');
  tube.classList.remove('floating');
  tube.classList.add('shaking');
  setTimeout(() => {
    tube.classList.remove('shaking');
    tube.classList.add('floating');
    isShaking = false;
  }, 1350);
}

function drawLot() {
  playGong();
  doShake();
  setTimeout(() => {
    const lots = LOTS[selectedKey];
    const lot = lots[Math.floor(Math.random() * lots.length)];
    currentLot = lot;
    showResult(lot);
    setTimeout(() => playRevealChime(), 500);
  }, 1150);
}

// ────────────────────────────────────────────────
// SHOW RESULT
// ────────────────────────────────────────────────
function lvClass(lv) {
  if (lv.includes('大吉')||lv.includes('上上')) return 'lv-da';
  if (lv.includes('上吉')) return 'lv-shang';
  if (lv.includes('中吉')) return 'lv-zhji';
  if (lv.includes('平'))   return 'lv-ping';
  if (lv.includes('下下')) return 'lv-xx';
  return 'lv-xia';
}

function showResult(lot) {
  const d = DEITY_CONFIG[selectedKey];
  const rs = document.getElementById('result-section');
  rs.style.display = 'block';
  rs.classList.remove('result-rise');
  void rs.offsetWidth;
  rs.classList.add('result-rise');

  document.getElementById('r-deity').textContent = d.name + '　靈籤';
  document.getElementById('r-no').textContent    = lot.no;
  document.getElementById('r-seal').innerHTML    = d.name[0] + '<br>籤';

  const lv = document.getElementById('r-level');
  lv.textContent = lot.level;
  lv.className   = `result-level ${lvClass(lot.level)}`;

  // Vertical poem
  const pv = document.getElementById('r-poem-v');
  pv.innerHTML =
    `<span class="poem-deco">❧❧❧</span>` +
    lot.poem.map(line => `<span class="poem-col">${line}</span>`).join('') +
    `<span class="poem-deco">❧❧❧</span>`;

  document.getElementById('r-explain').innerHTML =
    `<span class="gold-label">解籤說明：</span>${lot.explain}`;

  document.getElementById('r-grid').innerHTML = [
    {t:'感情',v:lot.love},{t:'事業',v:lot.career},
    {t:'財運',v:lot.wealth},{t:'健康',v:lot.health}
  ].map(x=>`<div class="detail-card"><h4>${x.t}</h4><p>${x.v}</p></div>`).join('');

  document.getElementById('r-advice').innerHTML =
    `<span class="gold-label">今日建議：</span>${lot.advice}`;

  // Scroll to result
  setTimeout(() => rs.scrollIntoView({behavior:'smooth', block:'start'}), 100);
}

// ────────────────────────────────────────────────
// RESET / COPY
// ────────────────────────────────────────────────
function resetDraw(silent) {
  if (!silent) playClick();
  currentLot = null;
  const rs = document.getElementById('result-section');
  rs.style.display = 'none';
}

function copyResult() {
  if (!currentLot) return;
  playClick();
  const d   = DEITY_CONFIG[selectedKey];
  const txt = [
    `【${d.name}靈籤】 ${currentLot.no}　${currentLot.level}`,
    '', currentLot.poem.join('\n'), '',
    `解籤：${currentLot.explain}`, '',
    `今日建議：${currentLot.advice}`,
    '', '── 靈籤祈願所'
  ].join('\n');
  navigator.clipboard.writeText(txt).then(() => {
    const btn = document.activeElement;
    const orig = btn.textContent;
    btn.textContent = '已複製 ✓';
    setTimeout(() => { btn.textContent = orig; }, 2200);
  }).catch(() => prompt('請手動複製：', txt));
}

  initStars();
  // iOS AudioContext unlock
  document.addEventListener('click', () => { try { getAC(); } catch(e){} }, {once:true});
});
